services:
  goshala-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: goshala-ai:latest
    container_name: goshala-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      PYTHONUNBUFFERED: "1"
    ports:
      - "5001:8001"
    volumes:
      - ./data:/app/data:rw
    depends_on:
      ollama-model:
        condition: service_completed_successfully
      goshala-kb:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  goshala-kb:
    build:
      context: .
      dockerfile: Dockerfile
    image: goshala-ai:latest
    container_name: goshala-kb-builder
    restart: "no"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data:rw
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    command: ["python", "scripts/build_kb.py"]

  ollama:
    image: ollama/ollama:latest
    container_name: goshala-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

  ollama-model:
    image: ollama/ollama:latest
    container_name: goshala-ollama-model
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull embeddinggemma:300m

volumes:
  ollama_data:
